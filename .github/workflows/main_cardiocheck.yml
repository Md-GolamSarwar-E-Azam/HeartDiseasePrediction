# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - cardiocheck

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: mlopsreg.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_1A7F7500EBD140ADBBFB2DA60B7D2B26 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_60E1C2C187424139AB35409D582B5A01 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: mlopsreg.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_1A7F7500EBD140ADBBFB2DA60B7D2B26 }}/cardiocheck:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'cardiocheck'
          slot-name: 'Production'
          images: 'mlopsreg.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_1A7F7500EBD140ADBBFB2DA60B7D2B26 }}/cardiocheck:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6A3F10673BA1496D9C1C032021A7C3EC }}